<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDoリスト</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="main">
            <header>
                <h1>ToDoリスト</h1>
                <div class="head-div">
                    <div>
                        <span>期間</span>
                        <input type="date" id="date-fr" required>
                        <span>~</span>
                        <input type="date" id="date-to" required>
                    </div>
                    <button type="button" id="btnShow">照会</button>
                </div>
            </header>
            <div class="container">
                <div class="todo-item">
                    <span class="handle">::</span>
                    <input type="checkbox">
                    <div class="content" contenteditable="true"></div>
                </div>
            </div>
        </main>
        <script src="app.js"></script>
    </body>
</html>
